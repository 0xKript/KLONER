# Lint, types, security lint, the test suite with its coverage gates (spec §18.7), the full self-test, and the
# release SBOM (§16.8).
#
# GitHub's ubuntu-24.04 and macos-15 images ship JDK 17 and Android SDK build-tools 36.0.0 under $ANDROID_HOME
# (licenses accepted by the images). `kloner setup` finds that SDK and refuses it unless lib/apksigner.jar matches
# the pinned SHA-256. apkeep 1.1.0 has no macOS build, so apkpure/googleplay report DISABLED there (D-061).
# The docker-license-gate job builds the image without accepting the Android SDK license, which must fail with
# instructions (D-065); CI never accepts that license on anyone's behalf. Actions are pinned by commit SHA.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      KLONER_FUZZ_ITERATIONS: "1000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install from the lock file
        run: uv sync --frozen

      - name: Lint and format
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Types
        run: uv run mypy

      - name: Security lint
        run: uv run bandit -q -c pyproject.toml -r src

      - name: Toolchain
        run: |
          uv run kloner setup
          uv run kloner doctor

      - name: Tests and coverage gates
        run: |
          uv run pytest --cov=kloner --cov-report=json:coverage.json --cov-report=
          uv run python scripts/check_coverage.py coverage.json

      - name: Self-test
        run: uv run kloner selftest --full

      - name: SBOM
        if: runner.os == 'Linux'
        run: uv run python scripts/build_sbom.py --out dist/kloner.cdx.json

      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/kloner.cdx.json

  # A clean machine: no license file in docker/android-licenses/ and no ACCEPT_ANDROID_SDK_LICENSE. The image must
  # refuse to build, say how to accept the license explicitly, and download nothing from Google (D-065).
  docker-license-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The image does not build without an explicit license acceptance
        run: |
          test ! -e docker/android-licenses/android-sdk-license
          if docker build --progress=plain -t kloner-gate . > build.log 2>&1; then
            echo "the build passed without an explicit license acceptance"; exit 1
          fi
          tail -n 12 build.log
          # the gate's own output lines ("#<step> <seconds> ..."), not the Dockerfile excerpt of the error
          grep -Eq '^#[0-9]+ [0-9.]+ error: the Android SDK license has not been accepted' build.log
          grep -Eq '^#[0-9]+ [0-9.]+ +docker build --build-arg ACCEPT_ANDROID_SDK_LICENSE=yes -t kloner \.$' build.log
          grep -Eq '^#[0-9]+ [0-9.]+ Read https://developer\.android\.com/studio/terms' build.log
          if grep -q "Downloading Android command-line tools" build.log; then
            echo "the build downloaded the SDK before the license was accepted"; exit 1
          fi

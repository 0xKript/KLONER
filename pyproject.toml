[project]
name = "kloner"
version = "1.0.0"
description = "Key-Lineage Oracle for Network-wide Exposure of Repackaging: prove every copy of an Android app genuine or not."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Khel (0xKript)" }]
keywords = ["android", "apk", "apksig", "repackaging", "brand-protection", "threat-intelligence"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Security",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "cryptography>=43",
    "asn1crypto>=1.5.1",
    "androguard>=4.1.2",
    "pydantic>=2.7",
    "jinja2>=3.1.4",
    "Pillow>=10.4",
    "stix2>=3.0.1",
]

[project.scripts]
kloner = "kloner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "bandit>=1.7.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kloner"]

[tool.hatch.build.targets.wheel.force-include]
"data/known_keys.json" = "kloner/data/known_keys.json"
"data/confusables.json" = "kloner/data/confusables.json"
"bridge/KlonerApksigBridge.java" = "kloner/bridge/KlonerApksigBridge.java"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PTH", "N"]
ignore = ["S101", "PTH101", "PTH105", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "N802", "N806"]
"scripts/**" = ["T201"]
"src/kloner/selftest/**" = ["N806"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.11"
mypy_path = "src"
packages = ["kloner"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["androguard.*", "stix2.*", "asn1crypto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "corpus: builds and evaluates the synthetic corpus (needs the toolchain)",
    "toolchain: needs JDK + build-tools",
    "slow: long-running",
]

[tool.coverage.run]
source = ["kloner"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B101: asserts are used only to narrow Optional types for mypy; no check that guards a verdict or
# hostile input relies on an assert (docs/DECISIONS.md, D-031).
skips = ["B101"]
